<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1e1c"><link rel="manifest" href="manifest.webmanifest"><title>D.I.S.M.I.S. Workshop · Fixed</title><style> :root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#091713;color:#eef6ed}header{padding:22px 18px;background:#102923;border-bottom:1px solid #315247}h1{font-size:1.3rem;margin:0}header p{color:#b8cbbf;font-size:.88rem;margin:6px 0 0}.wrap{max-width:850px;margin:auto;padding:15px}input,textarea,select,button{font:inherit;border-radius:10px;border:1px solid #426253;padding:12px;background:#162d26;color:#fff}input,textarea{width:100%}button{cursor:pointer}button.primary{background:#b8ef91;color:#102318;border:0;font-weight:700}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button{white-space:nowrap}.tabs .on{background:#b8ef91;color:#102318}.card{background:#112720;border:1px solid #315044;border-radius:14px;padding:16px;margin:11px 0}h2{font-size:1.12rem;margin:0 0 8px}h3{font-size:1rem;margin:20px 0 7px}.muted{color:#b3c7ba;font-size:.88rem}.pill{font-size:.75rem;border-radius:30px;background:#254638;padding:5px 9px;display:inline-block;margin-bottom:8px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.step{padding:12px 0;border-bottom:1px solid #294639}.step:last-child{border:0}.warn{border-left:3px solid #f5c16c;padding:10px 13px;background:#30291b;border-radius:6px}label{display:block;margin:12px 0 6px}.back{margin:4px 0 14px}.hidden{display:none}footer{padding:24px;color:#9db4a6;text-align:center;font-size:.75rem} .check{display:flex;gap:9px;align-items:start;padding:7px 0}.check input{width:auto;margin-top:5px} .check span{flex:1} .progress{height:7px;background:#315044;border-radius:8px;overflow:hidden;margin:10px 0}.progress>div{background:#b8ef91;height:100%;transition:width .2s} </style></head><body><header><h1>D.I.S.M.I.S. · Field Workshop</h1><p>Survival skills • beginner-to-builder guides · repaired interface</p></header><main class="wrap"><div class="tabs"><button id="tab-guides" class="on" onclick="view('guides')">Workshop</button><button id="tab-notes" onclick="view('notes')">Field Notes</button><button id="tab-about" onclick="view('about')">About / Offline</button></div><section id="main"></section></main><footer>Reference material, not a substitute for trained emergency responders or verified equipment manuals. No account required.</footer><script>let guides=[];let active='guides',filter='all',query='',current=null;const root=document.getElementById('main');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Local storage unavailable')}};const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}};function view(tab){active=tab;current=null;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.id==='tab-'+tab));render()}function render(){if(active==='notes')return notes();if(active==='about')return about();if(current)return detail(current);listing()}function listing(){let cats=['all',...new Set(guides.map(g=>g.cat))];let matches=guides.filter(g=>(filter==='all'||g.cat===filter)&&(`${g.title} ${g.category} ${g.overview} ${g.materials.join(' ')}`.toLowerCase().includes(query.toLowerCase())));root.innerHTML=`<div class="card"><h2>Find a practical guide</h2><input id="search" placeholder="Search water, solar, shelter, radio..." value="${esc(query)}" aria-label="Search guides"><div class="muted" style="margin-top:9px">${guides.length} offline guides available · ${matches.length} matching</div></div><div class="row"><select id="cat" aria-label="Filter by category">${cats.map(c=>`<option value="${c}" ${c===filter?'selected':''}>${c==='all'?'All categories':guides.find(g=>g.cat===c)?.category}</option>`).join('')}</select></div><div id="results">${matches.map(g=>`<div class="card"><span class="pill">${esc(g.category)} · ${esc(g.level)}</span><h2>${esc(g.title)}</h2><p class="muted">${esc(g.overview)}</p><button class="primary" data-id="${g.id}">Open step-by-step guide</button></div>`).join('')||'<p>No matching guides.</p>'}</div>`;document.getElementById('search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;listing();let inp=document.getElementById('search');inp.focus();inp.setSelectionRange(pos,pos)};document.getElementById('cat').onchange=e=>{filter=e.target.value;listing()};root.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{current=b.dataset.id;render();window.scrollTo(0,0)})}function detail(id){let g=guides.find(x=>x.id===id);if(!g)return listing();let done=load('progress-'+id,{});let count=g.steps.filter((_,i)=>done[i]).length;root.innerHTML=`<button class="back" id="back">← All guides</button><div class="card"><span class="pill">${esc(g.category)} · ${esc(g.level)}</span><h2>${esc(g.title)}</h2><p>${esc(g.overview)}</p><h3>Materials and tools</h3>${g.materials.map(m=>`<div class="check"><input type="checkbox" aria-label="Have ${esc(m)}"><span>${esc(m)}</span></div>`).join('')}<h3>Step-by-step instructions</h3><div class="muted" id="count">${count} of ${g.steps.length} steps completed</div><div class="progress"><div id="bar" style="width:${100*count/g.steps.length}%"></div></div>${g.steps.map((s,i)=>`<label class="step check"><input type="checkbox" data-step="${i}" ${done[i]?'checked':''}><span><strong>Step ${i+1}.</strong> ${esc(s)}</span></label>`).join('')}<h3>Safety and limitations</h3><div class="warn">${esc(g.warning)}</div><p class="muted">Progress is saved only on this device. Guides are general educational instructions; confirm component-specific ratings and local rules.</p><button id="reset">Reset progress</button></div>`;document.getElementById('back').onclick=()=>{current=null;listing()};document.getElementById('reset').onclick=()=>{store('progress-'+id,{});detail(id)};root.querySelectorAll('[data-step]').forEach(b=>b.onchange=e=>{done[e.target.dataset.step]=e.target.checked;store('progress-'+id,done);count=g.steps.filter((_,i)=>done[i]).length;document.getElementById('count').textContent=`${count} of ${g.steps.length} steps completed`;document.getElementById('bar').style.width=(100*count/g.steps.length)+'%'})}function notes(){let val=load('field-notes','');root.innerHTML=`<div class="card"><h2>Private field notes</h2><p class="muted">Saved on this device only. Not uploaded to GitHub or any server. Export a backup because browsers may clear local storage.</p><textarea id="note" rows="14" placeholder="Record supplies, locations, observations, experiments...">${esc(val)}</textarea><div class="row" style="margin-top:12px"><button class="primary" id="save">Save notes</button><button id="export">Export text backup</button></div><p id="status" class="muted"></p></div>`;document.getElementById('save').onclick=()=>{store('field-notes',document.getElementById('note').value);document.getElementById('status').textContent='Saved locally on this device.'};document.getElementById('export').onclick=()=>{let blob=new Blob([document.getElementById('note').value],{type:'text/plain'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='dismis-field-notes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}function about(){root.innerHTML=`<div class="card"><h2>Offline operation</h2><p>This version includes ${guides.length} written project guides, searchable categories, step tracking, and local field notes. It is <strong>not</strong> an AI model and cannot identify plants or electronic components from photographs.</p><p>Open the app while online once and allow the browser to cache it. Then test with airplane mode. Browser storage can be evicted, so keep a backup.</p><button id="offline">Check offline cache</button><p id="cache" class="muted"></p><h3>What comes next</h3><p>More illustrated, verified project manuals; materials substitution logic; calculators; downloadable maps; and a compatible local AI connection.</p></div>`;document.getElementById('offline').onclick=async()=>{let keys=await caches.keys();document.getElementById('cache').textContent=keys.length?'Cache found: '+keys.join(', '):'No offline cache found yet. Open the app online and reload.'}}async function start(){try{let r=await fetch('./guides.json?release=workshop-fix-3',{cache:'no-store'});if(!r.ok)throw Error('Guides unavailable');guides=await r.json();render()}catch(e){root.innerHTML='<div class="warn">Guide library could not load: '+esc(e.message)+'. Check internet and refresh.</div>'}}start();if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js?repair=3").catch(()=>{});</script></body></html>
